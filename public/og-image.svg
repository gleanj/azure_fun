<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative particles -->
  <circle cx="100" cy="100" r="3" fill="#4ade80" opacity="0.5"/>
  <circle cx="1100" cy="500" r="4" fill="#60a5fa" opacity="0.4"/>
  <circle cx="200" cy="550" r="2" fill="#a78bfa" opacity="0.6"/>
  <circle cx="1050" cy="80" r="3" fill="#4ade80" opacity="0.5"/>
  <circle cx="950" cy="200" r="2" fill="#60a5fa" opacity="0.4"/>

  <!-- Shield icon -->
  <path d="M150 250 L200 270 L200 320 Q200 360 150 390 Q100 360 100 320 L100 270 Z"
        fill="none" stroke="url(#textGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Main content -->
  <text x="280" y="270" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="bold" fill="white">
    Nicholas Gleason
  </text>

  <text x="280" y="335" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="500" fill="#60a5fa">
    Cybersecurity Engineer
  </text>

  <text x="280" y="390" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">
    Incident Response • Threat Hunting • Security Infrastructure
  </text>

  <!-- Tech badges -->
  <rect x="280" y="430" width="120" height="40" rx="8" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="340" y="456" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#60a5fa" text-anchor="middle">
    SentinelOne
  </text>

  <rect x="415" y="430" width="110" height="40" rx="8" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="470" y="456" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#60a5fa" text-anchor="middle">
    CrowdStrike
  </text>

  <rect x="540" y="430" width="90" height="40" rx="8" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="585" y="456" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#60a5fa" text-anchor="middle">
    Rapid7
  </text>

  <rect x="645" y="430" width="70" height="40" rx="8" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="680" y="456" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#60a5fa" text-anchor="middle">
    GPEN
  </text>

  <!-- Website -->
  <text x="280" y="540" font-family="JetBrains Mono, monospace" font-size="24" font-weight="500" fill="url(#textGrad)">
    nicksec.com
  </text>
</svg>
